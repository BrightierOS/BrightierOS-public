<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07080c" />
  <meta name="description" content="BrightierOS — Dashboard de infraestrutura" />
  <title>BrightierOS — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="dashboard" data-title="Dashboard" data-sub="Visão geral da infraestrutura">
  <div id="boot-loader" aria-hidden="true">
    <div class="boot-loader-inner">
      <div class="boot-logo">
        <img src="assets/BrightierOS.png" alt="BrightierOS" onerror="this.style.display='none'">
      </div>
      <div class="boot-name">Brightier<b>OS</b></div>
      <div class="boot-spinner"></div>
      <div class="boot-text">Inicializando o sistema…</div>
    </div>
  </div>

  <main class="page" id="dashboard-content">
    <!-- Widgets serão renderizados aqui pelo sistema de widgets -->
    <div class="widget-grid" aria-label="Dashboard widgets">
      <div class="widget-card skeleton">
        <div class="widget-header"><span class="skeleton skeleton-text" style="width:40%"></span></div>
        <div class="widget-body"><div class="skeleton skeleton-card"></div></div>
      </div>
      <div class="widget-card skeleton">
        <div class="widget-header"><span class="skeleton skeleton-text" style="width:40%"></span></div>
        <div class="widget-body"><div class="skeleton skeleton-card"></div></div>
      </div>
      <div class="widget-card skeleton">
        <div class="widget-header"><span class="skeleton skeleton-text" style="width:40%"></span></div>
        <div class="widget-body"><div class="skeleton skeleton-card"></div></div>
      </div>
      <div class="widget-card skeleton">
        <div class="widget-header"><span class="skeleton skeleton-text" style="width:40%"></span></div>
        <div class="widget-body"><div class="skeleton skeleton-card"></div></div>
      </div>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/themes.js"></script>
  <script src="assets/widgets.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
